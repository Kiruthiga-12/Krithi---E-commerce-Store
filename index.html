<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Krithi Home Page</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="index.css" />
    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .homepage_header {
        width: 100%;
        background-color: #222;
        color: white;
        position: sticky;
      }
      .homepage_header_nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 80%;
        margin: auto;
      }
      .homepage_header_ul {
        display: flex;
        justify-content: space-between;
        flex: 0.5;
      }
      .homepage_header_ul li {
        list-style-type: none;
        display: inline-block;
        flex: 2;
      }
      #cart_icon {
        cursor: pointer;
      }
      .banner {
        width: 100%;
        background-image: linear-gradient(to right, cyan, blue);
        display: flex;
        justify-content: space-around;
        align-content: center;
      }

      .banner_div {
        text-align: center;
      }
      #banner_button {
        cursor: pointer;
        background-color: yellow;
        border-radius: 10px;
      }
      #banner_button:hover {
        background-color: darkorange;
      }
      #product_container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        grid-template-rows: 1fr 1fr 1fr;
        grid-auto-rows: 1fr;
        grid-auto-flow: row;
        grid-gap: 20px;
        margin: 2vw;
        border: 1px solid red;
      }
      .product_item {
        border-radius: 10px;
        border: 1px solid green;
        text-align: center;
        cursor: pointer;
        margin: 2vw;
      }
      .add_to_cart {
        cursor: pointer;
      }

      #filter_line li {
        display: inline;
        background-color: lightgreen;
        padding: 1.2vw;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!--Header Section-->
    <header class="homepage_header">
      <nav class="homepage_header_nav">
        <h3>Krithi</h3>
        <ul class="homepage_header_ul">
          <li>Home</li>
          <li>Shop</li>
          <li>Cart</li>
          <li>Login</li>
        </ul>
        <input type="search" id="search_item" placeholder="Search..." />
        <p id="cart_icon">&#128722; <sup id="cart_count"></sup></p>
      </nav>
    </header>
    <!--Banner Section-->
    <section class="banner">
      <div class="banner_div">
        <h2 id="banner_heading">Big Sale Today!</h2>
        <h5 id="banner_subtext">Upto 50% off</h5>
      </div>
      <a href="#product_section"
        ><button id="banner_button">Shop now</button></a
      >
    </section>
    <!--product Section-->
    <section id="product_section">
      <h2>Product Section</h2>
      <!--Filter-->
      <section id="filter_container">
        <ul id="filter_line">
          <li>All</li>
          <li>Electronics</li>
          <li>Clothing</li>
        </ul>
      </section>
      <div id="product_container"></div>
    </section>
    <!--Footer Section-->
    <footer>
      <p>Text: "© 2026 MyStore"</p>
      <ul class="footer_ul">
        <li>About</li>
        <li>Contact</li>
        <li>Private Policy</li>
      </ul>
    </footer>
    <script src="index.js" type="module"></script>
  </body>
</html>
