<!doctype html>
<html lang="en-US">
  <head>
    <title>Krithi Home Page</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="/Styles/index.css" />
  </head>
  <body>
    <!--Header Section-->
    <header class="homepage_header">
      <nav class="homepage_header_nav">
        <h3>Krithi</h3>
        <ul class="homepage_header_ul">
          <li>Home</li>
          <li>Shop</li>
          <li>Cart</li>
          <li id="login">Login</li>
          <li id='logout'>Logout</li>
        </ul>
        <input type="search" id="search_item" placeholder="Search..." />
        <p id="cart_icon">&#128722; <sup id="cart_count"></sup></p>
      </nav>
    </header>
    <!--Banner Section-->
    <section class="banner">
      <div class="banner_div">
        <h1 id="banner_heading">Big Sale Today!</h1>
        <h3 id="banner_subtext">Upto 50% off</h3>
      </div>
      <a href="#product_section"
        ><input type="button" class="banner_button" value="Shop now"></a
      >
    </section>
    <!-- Body Section -->
    <div style="margin: 2vw 5vw">
      <!--product Section-->
      <section id="product_section">
        <h2>Product Section</h2>
        <!--Filter-->
        <section id="filter_container">
          <ul id="filter_line">
            <li>All</li>
            <li>Electronics</li>
            <li>Clothing</li>
          </ul>
        </section>
        <div id="product_container"></div>
      </section>
      <!--Footer Section-->
      <footer id="footer">
        <p>Text: "© 2026 MyStore"</p>
        <ul class="footer_ul">
          <li>About</li>
          <li>Contact</li>
          <li>Private Policy</li>
        </ul>
      </footer>
    </div>
    <script src="index.js" type="module"></script>
  </body>
</html>
